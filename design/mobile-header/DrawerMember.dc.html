<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=DM+Sans:wght@400;500;600&display=swap');
    :root{
      --surface-page:#f7f4ef; --surface-raised:#ffffff; --surface-sunken:#f2ede5; --surface-input:#faf8f4;
      --border-default:#d6cec4; --border-soft:#e5dfd5; --border-strong:#a8a099;
      --text-primary:#1e1a16; --text-secondary:#4e443c; --text-tertiary:#6b6258;
      --accent:#3f6845; --accent-hover:#2e5033; --accent-contrast:#ffffff; --accent-tint-bg:#eaf2eb;
      --shadow-card:0 2px 12px rgba(60,45,25,.08); --shadow-modal:0 24px 64px rgba(60,45,25,.18);
      --font-serif:'Fraunces',Georgia,serif; --font-sans:'DM Sans',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);}
    a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent-hover);}
    @keyframes slideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    .navlink{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:12px;font-size:15px;font-weight:500;color:var(--text-secondary);}
    .navlink svg{flex-shrink:0;color:var(--text-tertiary);}
    .navlink.active{background:var(--accent-tint-bg);color:var(--accent);font-weight:600;}
    .navlink.active svg{color:var(--accent);}
  </style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;position:relative;overflow:hidden;">

  <header style="height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 18px;background:var(--surface-raised);box-shadow:var(--shadow-card);position:relative;z-index:1;">
    <a href="#" style="font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:23px;letter-spacing:-.3px;color:var(--text-primary);display:flex;align-items:center;gap:7px;">
      <span style="font-style:normal;font-size:11px;color:var(--accent);position:relative;top:-1px;">&#10022;</span>Kageo
    </a>
    <button aria-label="Open menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:100px;color:var(--text-secondary);cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main style="flex-grow:1;padding:30px 20px;">
    <p style="font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary);margin:0 0 8px;">Wishlists</p>
    <h1 style="font-family:var(--font-serif);font-weight:400;font-size:34px;line-height:1.08;letter-spacing:-.4px;margin:0;color:var(--text-primary);">My wishlists</h1>
  </main>

  <div style="position:absolute;inset:0;background:rgba(30,26,22,.45);animation:fadeIn .2s ease both;z-index:5;"></div>

  <aside style="position:absolute;top:0;right:0;height:100%;width:314px;background:var(--surface-raised);box-shadow:var(--shadow-modal);z-index:6;display:flex;flex-direction:column;padding:12px 16px 26px;animation:slideIn .28s cubic-bezier(.16,1,.3,1) both;">

    <div style="display:flex;justify-content:flex-end;">
      <button aria-label="Close menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:100px;color:var(--text-secondary);cursor:pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <nav style="display:flex;flex-direction:column;gap:2px;margin-top:2px;">
      <a href="#" class="navlink active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7.5h20V12H2zM12 21.5V7.5M12 7.5S12 3 8.75 3 5.5 7.5 5.5 7.5s3 0 6.5 0zM12 7.5s0-4.5 3.25-4.5S18.5 7.5 18.5 7.5s-3 0-6.5 0z"/></svg>
        Wishlists
      </a>
      <a href="#" class="navlink">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 5v4h4M12 7.5V12l3 2"/></svg>
        History
      </a>
    </nav>

    <div style="height:1px;background:var(--border-soft);margin:16px 6px;"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 14px;">
      <span style="font-size:13px;color:var(--text-tertiary);font-weight:500;">Language</span>
      <span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;letter-spacing:.04em;">
        <a href="#" style="color:var(--text-primary);font-weight:600;">EN</a>
        <span style="color:var(--border-default);" aria-hidden="true">|</span>
        <a href="#" style="color:var(--text-tertiary);">FR</a>
      </span>
    </div>

    <div style="flex-grow:1;"></div>

    <div style="height:1px;background:var(--border-soft);margin:0 6px 14px;"></div>

    <a href="#" style="display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;margin-bottom:10px;">
      <span style="width:38px;height:38px;flex-shrink:0;border-radius:100px;background:var(--accent-tint-bg);color:var(--accent);font-family:var(--font-serif);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;">S</span>
      <span style="display:flex;flex-direction:column;line-height:1.3;">
        <span style="font-size:14px;color:var(--text-primary);font-weight:500;">Sofia Marchetti</span>
        <span style="font-size:12px;color:var(--text-tertiary);">View profile</span>
      </span>
    </a>

    <button style="width:100%;background:transparent;color:var(--text-tertiary);border:1px solid var(--border-soft);padding:11px;border-radius:100px;font-family:var(--font-sans);font-size:13px;font-weight:500;cursor:pointer;">Log out</button>

  </aside>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
