<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=DM+Sans:wght@400;500;600&display=swap');
    :root{
      --surface-page:#f7f4ef; --surface-raised:#ffffff; --surface-sunken:#f2ede5; --surface-input:#faf8f4;
      --border-default:#d6cec4; --border-soft:#e5dfd5; --border-strong:#a8a099;
      --text-primary:#1e1a16; --text-secondary:#4e443c; --text-tertiary:#6b6258;
      --accent:#3f6845; --accent-hover:#2e5033; --accent-contrast:#ffffff; --accent-tint-bg:#eaf2eb;
      --shadow-card:0 2px 12px rgba(60,45,25,.08);
      --font-serif:'Fraunces',Georgia,serif; --font-sans:'DM Sans',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);}
    a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent-hover);}
  </style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;">

  <header style="height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 18px;background:var(--surface-raised);box-shadow:var(--shadow-card);position:relative;z-index:2;">
    <a href="#" style="font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:23px;letter-spacing:-.3px;color:var(--text-primary);display:flex;align-items:center;gap:7px;">
      <span style="font-style:normal;font-size:11px;color:var(--accent);position:relative;top:-1px;">&#10022;</span>Kageo
    </a>
    <button aria-label="Open menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:100px;color:var(--text-secondary);cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main style="flex-grow:1;padding:30px 20px;">
    <p style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary);margin:0 0 8px;">Wishlists</p>
    <h1 style="font-family:var(--font-serif);font-weight:400;font-size:34px;line-height:1.08;letter-spacing:-.4px;margin:0 0 26px;color:var(--text-primary);text-wrap:pretty;">My wishlists</h1>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="background:var(--surface-raised);border:1px solid var(--border-soft);border-radius:16px;box-shadow:var(--shadow-card);padding:18px 18px 16px;">
        <div style="font-family:var(--font-serif);font-size:19px;font-weight:500;color:var(--text-primary);margin-bottom:4px;">Birthday, June</div>
        <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:12px;">8 items &middot; shared with 3 people</div>
        <span style="display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--accent);background:var(--accent-tint-bg);padding:4px 10px;border-radius:100px;">Active</span>
      </div>
      <div style="background:var(--surface-raised);border:1px solid var(--border-soft);border-radius:16px;box-shadow:var(--shadow-card);padding:18px 18px 16px;">
        <div style="font-family:var(--font-serif);font-size:19px;font-weight:500;color:var(--text-primary);margin-bottom:4px;">Home &amp; kitchen</div>
        <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:12px;">12 items &middot; private</div>
        <span style="display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-tertiary);background:var(--surface-sunken);padding:4px 10px;border-radius:100px;">Draft</span>
      </div>
    </div>
  </main>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
