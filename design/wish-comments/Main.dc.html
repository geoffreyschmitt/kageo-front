<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');
    :root{
      --surface-page:#f7f4ef; --surface-raised:#ffffff; --surface-sunken:#f2ede5; --surface-sunken-2:#ebe5da; --surface-input:#faf8f4;
      --border-default:#d6cec4; --border-soft:#e5dfd5; --border-strong:#a8a099;
      --text-primary:#1e1a16; --text-secondary:#4e443c; --text-tertiary:#6b6258;
      --accent:#3f6845; --accent-hover:#2e5033; --accent-contrast:#ffffff; --accent-tint-bg:#eaf2eb; --accent-tint-border:rgba(63,104,69,.20);
      --status-wanted-fg:#1a5491; --status-wanted-bg:#edf3fb;
      --status-proposed-fg:#6e3c0c; --status-proposed-bg:#fdf0e6;
      --shadow-card:0 2px 12px rgba(60,45,25,.08); --shadow-hover:0 8px 28px rgba(60,45,25,.13);
      --font-serif:'Fraunces',Georgia,serif; --font-sans:'DM Sans',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);}
    a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent-hover);}
    .cmt-btn:hover{border-color:var(--border-strong);color:var(--text-primary);}
  </style>
</helmet>
<div style="padding:40px 30px;display:flex;justify-content:center;">
  <div style="width:380px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-card);display:flex;flex-direction:column;">

    <div style="position:relative;width:100%;height:230px;background:linear-gradient(145deg,#f2ede5,#ebe5da 50%,#f2ede5);overflow:hidden;">
      <svg viewBox="0 0 380 230" style="position:absolute;inset:0;width:100%;height:100%;" fill="none" aria-hidden="true">
        <circle cx="190" cy="112" r="52" stroke="#3f6845" stroke-width="4" opacity="0.18"/>
        <circle cx="128" cy="150" r="30" stroke="#3f6845" stroke-width="4" opacity="0.14"/>
        <circle cx="252" cy="150" r="30" stroke="#3f6845" stroke-width="4" opacity="0.14"/>
        <path d="M138 150h104M190 150V88M190 88l30 20M190 150l-30 -14" stroke="#3f6845" stroke-width="4" stroke-linecap="round" opacity="0.16"/>
      </svg>
      <div style="position:absolute;top:14px;left:14px;font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;padding:4px 10px 5px;border-radius:5px;background:var(--status-proposed-bg);color:var(--status-proposed-fg);box-shadow:0 1px 4px rgba(110,60,12,0.2);">Priorité moyenne</div>
      <div style="position:absolute;top:14px;right:14px;font-family:var(--font-sans);font-size:10px;font-weight:600;letter-spacing:0.3px;padding:4px 11px 5px;border-radius:100px;background:var(--status-wanted-bg);color:var(--status-wanted-fg);box-shadow:0 1px 4px rgba(26,84,145,0.15);">Souhaité</div>
    </div>

    <div style="padding:20px 22px 18px;flex:1;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;">
        <h3 style="font-family:var(--font-serif);font-size:24px;font-weight:600;color:var(--text-primary);margin:0;line-height:1.18;letter-spacing:-0.1px;">Vélo de ville vintage</h3>
        <div style="font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap;background:var(--accent-tint-bg);padding:4px 10px 5px;border-radius:6px;border:1px solid var(--accent-tint-border);align-self:flex-start;margin-top:4px;letter-spacing:0.2px;">€240.00</div>
      </div>

      <p style="font-family:var(--font-sans);font-size:13.5px;color:var(--text-secondary);line-height:1.6;margin:0 0 14px;">Cadre acier col de cygne, cuir cognac, panier avant. Taille M, coloris vert sauge de préférence.</p>

      <div style="margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
        <span style="font-family:var(--font-sans);font-size:11.5px;color:var(--text-tertiary);letter-spacing:0.1px;">Ajouté le 12 août 2026</span>
      </div>

      <!-- NEW — comment entry point replacing the inline thread -->
      <button class="cmt-btn" type="button" style="display:flex;align-items:center;gap:9px;width:100%;justify-content:space-between;padding:10px 13px;border:1px solid var(--border-soft);border-radius:12px;background:var(--surface-input);font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:border-color .15s ease,color .15s ease;">
        <span style="display:flex;align-items:center;gap:9px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-tertiary);"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5Z"/></svg>
          <span>3&nbsp;commentaires</span>
        </span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-tertiary);"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft);">
        <button style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:0.2px;padding:8px 16px;border-radius:100px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--accent-contrast);">Je réserve ce cadeau</button>
        <a href="#" style="font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:0.2px;padding:8px 16px;border-radius:100px;border:1px solid var(--border-default);background:var(--surface-raised);color:var(--text-secondary);">Voir la boutique</a>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":440,"height":680}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
