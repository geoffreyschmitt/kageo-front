<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=DM+Sans:wght@400;500;600&display=swap');
    :root{
      --surface-page:#f7f4ef; --surface-raised:#ffffff; --surface-sunken:#f2ede5; --surface-input:#faf8f4;
      --border-default:#d6cec4; --border-soft:#e5dfd5; --border-strong:#a8a099;
      --text-primary:#1e1a16; --text-secondary:#4e443c; --text-tertiary:#6b6258;
      --accent:#3f6845; --accent-tint-bg:#eaf2eb;
      --font-serif:'Fraunces',Georgia,serif; --font-sans:'DM Sans',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);}
    .cmt-btn{display:flex;align-items:center;gap:9px;width:260px;justify-content:space-between;padding:10px 13px;border:1px solid var(--border-soft);border-radius:12px;background:var(--surface-input);font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--text-secondary);cursor:pointer;}
    .cmt-btn .lead{display:flex;align-items:center;gap:9px;}
    .cmt-btn svg{color:var(--text-tertiary);flex-shrink:0;}
    .row{display:flex;align-items:center;gap:20px;}
    .cap{font-size:12px;color:var(--text-tertiary);line-height:1.4;}
  </style>
</helmet>
<div style="padding:34px 36px;">
  <p style="font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary);margin:0 0 6px;">Sur la card</p>
  <h1 style="font-family:var(--font-serif);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:-.3px;margin:0 0 22px;color:var(--text-primary);">États du compteur</h1>

  <div style="display:flex;flex-direction:column;gap:16px;">

    <div class="row">
      <button class="cmt-btn" style="color:var(--text-tertiary);">
        <span class="lead">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5Z"/></svg>
          <span>Commenter</span>
        </span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <span class="cap">Aucun commentaire — invite à ouvrir le fil</span>
    </div>

    <div class="row">
      <button class="cmt-btn">
        <span class="lead">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5Z"/></svg>
          <span>1&nbsp;commentaire</span>
        </span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <span class="cap">Singulier / pluriel géré côté i18n</span>
    </div>

    <div class="row">
      <button class="cmt-btn">
        <span class="lead">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5Z"/></svg>
          <span>12&nbsp;commentaires</span>
        </span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <span class="cap">Le compteur reste discret quel que soit le volume</span>
    </div>

    <div class="row">
      <button class="cmt-btn" style="color:var(--text-primary);border-color:var(--border-default);">
        <span class="lead">
          <span style="position:relative;display:flex;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5Z"/></svg>
            <span style="position:absolute;top:-2px;right:-3px;width:7px;height:7px;border-radius:100px;background:var(--accent);border:1.5px solid var(--surface-input);"></span>
          </span>
          <span style="font-weight:600;">3&nbsp;commentaires</span>
        </span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <span class="cap">Nouveaux depuis la dernière visite — pastille sauge + libellé plus appuyé</span>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":560,"height":440}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
